<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IntelliTrack Dashboard</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d9cf0;
      --border: #2a3548;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1b2a40, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }
    header h1 { margin: 0; font-size: 1.4rem; letter-spacing: 0.02em; }
    header span { color: var(--muted); font-size: 0.9rem; }
    main {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 1rem;
      padding: 1rem 1.5rem 2rem;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }
    .stream-wrap {
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stream-wrap img { width: 100%; height: 100%; object-fit: contain; }
    h2 { margin: 0 0 0.75rem; font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.25rem; }
    select, input {
      width: 100%;
      margin-bottom: 0.75rem;
      padding: 0.5rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #121821;
      color: var(--text);
    }
    button {
      background: var(--accent);
      color: #041018;
      border: 0;
      border-radius: 6px;
      padding: 0.55rem 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .metric {
      background: #121821;
      border-radius: 8px;
      padding: 0.7rem;
    }
    .metric .k { font-size: 0.75rem; color: var(--muted); }
    .metric .v { font-size: 1.15rem; font-variant-numeric: tabular-nums; margin-top: 0.15rem; }
    .status { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>IntelliTrack</h1>
    <span>Live tracking dashboard</span>
  </header>
  <main>
    <section class="panel">
      <h2>Live feed</h2>
      <div class="stream-wrap">
        <img id="stream" src="/stream" alt="Live annotated stream" />
      </div>
    </section>
    <section class="panel">
      <h2>Metrics</h2>
      <div class="metrics">
        <div class="metric"><div class="k">Mode</div><div class="v" id="m-mode">—</div></div>
        <div class="metric"><div class="k">FPS</div><div class="v" id="m-fps">—</div></div>
        <div class="metric"><div class="k">Latency (ms)</div><div class="v" id="m-lat">—</div></div>
        <div class="metric"><div class="k">Target</div><div class="v" id="m-tgt">—</div></div>
        <div class="metric"><div class="k">Pan °</div><div class="v" id="m-pan">—</div></div>
        <div class="metric"><div class="k">Tilt °</div><div class="v" id="m-tilt">—</div></div>
      </div>

      <h2>Config</h2>
      <form id="cfg-form">
        <label for="mode">Prediction mode</label>
        <select id="mode" name="mode">
          <option value="reactive_pid">reactive_pid</option>
          <option value="kalman">kalman</option>
          <option value="lstm">lstm</option>
          <option value="transformer">transformer</option>
        </select>

        <label for="kp">PID Kp</label>
        <input id="kp" type="number" step="0.001" value="0.05" />
        <label for="ki">PID Ki</label>
        <input id="ki" type="number" step="0.001" value="0.0" />
        <label for="kd">PID Kd</label>
        <input id="kd" type="number" step="0.001" value="0.01" />

        <label for="strategy">Selection strategy</label>
        <select id="strategy" name="strategy">
          <option value="closest_to_center">closest_to_center</option>
          <option value="largest_bbox">largest_bbox</option>
          <option value="highest_confidence">highest_confidence</option>
          <option value="manual_id_lock">manual_id_lock</option>
        </select>

        <button type="submit">Apply</button>
        <div class="status" id="status"></div>
      </form>
    </section>
  </main>
  <script>
    async function refreshMetrics() {
      try {
        const res = await fetch("/metrics");
        const m = await res.json();
        document.getElementById("m-mode").textContent = m.mode;
        document.getElementById("m-fps").textContent = m.fps.toFixed(1);
        document.getElementById("m-lat").textContent = m.latency_ms.toFixed(1);
        document.getElementById("m-tgt").textContent = m.target_found ? "found" : "lost";
        document.getElementById("m-pan").textContent = m.pan_deg.toFixed(1);
        document.getElementById("m-tilt").textContent = m.tilt_deg.toFixed(1);
      } catch (e) {
        console.warn(e);
      }
    }

    async function loadConfig() {
      try {
        const res = await fetch("/config");
        const cfg = await res.json();
        if (cfg.prediction && cfg.prediction.mode) {
          document.getElementById("mode").value = cfg.prediction.mode;
        }
        if (cfg.control && cfg.control.pid) {
          document.getElementById("kp").value = cfg.control.pid.kp;
          document.getElementById("ki").value = cfg.control.pid.ki;
          document.getElementById("kd").value = cfg.control.pid.kd;
        }
        if (cfg.tracking && cfg.tracking.selection_strategy) {
          document.getElementById("strategy").value = cfg.tracking.selection_strategy;
        }
      } catch (e) {
        console.warn(e);
      }
    }

    document.getElementById("cfg-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const body = {
        "prediction.mode": document.getElementById("mode").value,
        "control.pid.kp": parseFloat(document.getElementById("kp").value),
        "control.pid.ki": parseFloat(document.getElementById("ki").value),
        "control.pid.kd": parseFloat(document.getElementById("kd").value),
        "tracking.selection_strategy": document.getElementById("strategy").value,
      };
      const status = document.getElementById("status");
      try {
        const res = await fetch("/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        status.textContent = "Config applied.";
      } catch (e) {
        status.textContent = "Failed to apply config.";
      }
    });

    loadConfig();
    refreshMetrics();
    setInterval(refreshMetrics, 1000);
  </script>
</body>
</html>
